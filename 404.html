<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Сторінку не знайдено — Krona Hills</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0D100E">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/unbounded-cyrillic-6.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .nf { position: relative; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; overflow: hidden; padding: 40px var(--pad); }
    .nf svg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 55%; }
    .nf-in { position: relative; z-index: 1; max-width: 560px; }
    .nf-code { font: 300 clamp(96px, 26vw, 220px)/.9 var(--f-display); letter-spacing: -.04em; color: transparent; -webkit-text-stroke: 1px rgba(230, 223, 210, .3); margin-bottom: 18px; }
    .nf h1 { font: 300 clamp(26px, 5vw, 40px)/1.15 var(--f-display); margin-bottom: 16px; text-wrap: balance; }
    .nf p { color: var(--muted); margin-bottom: 32px; }
    .nf .logo { position: absolute; top: calc(20px + var(--safe-t)); left: var(--pad); z-index: 1; }
  </style>
</head>
<body>
  <main class="nf">
    <a class="logo" href="/" aria-label="Krona Hills — на головну">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true" style="position:static;width:22px;height:22px"><path d="M11 2 5 10h3l-4 6h14l-4-6h3z"/><path d="M11 16v4"/></svg>
      <span>KRONA HILLS</span>
    </a>
    <svg viewBox="0 0 1600 500" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path fill="#19201C" d="M0 500V260C200 200 330 230 520 250S860 180 1060 210 1420 260 1600 230V500Z"/>
      <path fill="#121714" d="M0 500V330C180 300 360 330 560 320S920 270 1140 300 1460 330 1600 310V500Z"/>
      <path fill="#0D100E" d="M0 500V410C240 380 470 400 700 395S1180 370 1600 390V500Z"/>
    </svg>
    <div class="nf-in">
      <p class="nf-code" aria-hidden="true">404</p>
      <h1>Ця стежка веде <span class="gold">в нікуди</span></h1>
      <p>Сторінку не знайдено. Можливо, посилання застаріло — повертайтеся до лісу, там усе на місці.</p>
      <a class="btn btn-gold" href="/">На головну</a>
    </div>
  </main>
</body>
</html>
