<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>OG</title>
<!-- Шаблон OG-зображення 1200×630. Генерація: bash tools/make-og.sh -->
<link rel="stylesheet" href="../css/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0D100E; color: #E6DFD2; }
  .bg { position: absolute; inset: 0; }
  .bg img { width: 100%; height: 100%; object-fit: cover; }
  .bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,13,11,.92) 0%, rgba(10,13,11,.6) 55%, rgba(10,13,11,.2) 100%); }
  svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .txt { position: absolute; left: 72px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; width: 900px; }
  .logo { display: flex; align-items: center; gap: 14px; font: 300 18px/1 'Unbounded'; letter-spacing: .38em; margin-bottom: 56px; }
  h1 { font: 300 60px/1.06 'Unbounded'; text-transform: uppercase; letter-spacing: -.01em; margin-bottom: 28px; }
  p { font: 400 24px/1.4 'Onest'; color: #A0A69B; }
  p b { color: #D2B57C; font-weight: 500; }
  .tag { position: absolute; right: 56px; bottom: 44px; font: 500 15px 'IBM Plex Mono'; letter-spacing: .16em; text-transform: uppercase; color: #A0A69B; }
</style>
</head>
<body>
  <div class="bg" id="bg"></div>
  <svg class="scene" id="scene" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
  <div class="txt">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 22 22" fill="none" stroke="#E6DFD2" stroke-width="1.2"><path d="M11 2 5 10h3l-4 6h14l-4-6h3z"/><path d="M11 16v4"/></svg>
      KRONA HILLS
    </div>
    <h1>Живіть у лісі.<br>Працюйте в місті.</h1>
    <p>Квартири в сосновому лісі · <b>22 хв</b> до центру Києва<br>від 1,9 млн грн · розстрочка 0%</p>
  </div>
  <div class="tag">Концепт-проєкт</div>
<script>
  // якщо рендер першого екрана вже є — ставимо його фоном, інакше малюємо нічну сцену
  const img = new Image();
  img.onload = () => { document.getElementById('bg').appendChild(img); document.getElementById('scene').remove(); };
  img.onerror = drawScene;
  img.src = '../images/hero/hero-desktop-1280.jpg';

  function drawScene() {
    const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('scene');
    let seed = 7; const rand = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
    const el = (t, a) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); svg.appendChild(n); return n; };
    const grad = el('linearGradient', { id: 'sky', x1: 0, y1: 0, x2: 0, y2: 1 });
    [['0', '#0A0D0B'], ['.6', '#151C18'], ['.82', '#2A2A1F'], ['1', '#0D100E']].forEach(([o, c]) => { const s = document.createElementNS(NS, 'stop'); s.setAttribute('offset', o); s.setAttribute('stop-color', c); grad.appendChild(s); });
    el('rect', { width: 1200, height: 630, fill: 'url(#sky)' });
    let stars = ''; for (let i = 0; i < 70; i++) { const x = rand() * 1200, y = rand() * 300, r = rand() * .9 + .3; stars += `M${x} ${y}m-${r} 0a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 -${2 * r} 0`; }
    el('path', { d: stars, fill: '#E6DFD2', opacity: .35 });
    const ridge = (x, L) => [400, 455, 510, 570][L] - [50, 44, 36, 24][L] * (.6 * Math.sin(x * .0028 + L * 1.7) + .3 * Math.sin(x * .0076 + L * 3.4) + .1 * Math.sin(x * .017 + L));
    const pine = (x, y, h) => { const w = h * .36; let d = ''; for (let t = 0; t < 4; t++) { const top = y - h + t * h * .18, b = top + h * .38, hw = w * (.16 + t * .11); d += `M${x} ${top}L${x - hw} ${b}L${x + hw} ${b}Z`; } return d; };
    const cols = ['#222A25', '#19201C', '#121714', '#0A0D0B'];
    for (let L = 0; L < 4; L++) {
      if (L === 2) [[700, 74], [800, 64], [960, 80], [1070, 70]].forEach(([x, w]) => {
        const top = Math.min(ridge(x, 2), ridge(x + w, 2)) - 58;
        el('rect', { x, y: top, width: w, height: 110, fill: '#1B201C' });
        for (let r = 0; r < 6; r++) for (let c = 0; c < 5; c++) if (rand() < .32) el('rect', { x: x + 5 + c * (w - 10) / 5, y: top + 6 + r * 8, width: (w - 10) / 5 - 3, height: 4.5, fill: '#E9C987', opacity: .9 });
      });
      let d = 'M-20 630'; for (let x = -20; x <= 1220; x += 16) d += `L${x} ${ridge(x, L).toFixed(1)}`;
      el('path', { d: d + 'L1220 630Z', fill: cols[L] });
      let t = ''; const n = [36, 30, 24, 12][L], h0 = [26, 40, 60, 110][L], h1 = [46, 70, 92, 180][L];
      for (let k = 0; k < n; k++) { const x = rand() * 1240 - 20; t += pine(x, ridge(x, L) + 5, h0 + rand() * (h1 - h0)); }
      el('path', { d: t, fill: cols[L] });
    }
    // затемнення під текстом
    const fade = el('linearGradient', { id: 'fade', x1: 0, y1: 0, x2: 1, y2: 0 });
    [['0', '#0A0D0B', .9], ['.55', '#0A0D0B', .45], ['1', '#0A0D0B', 0]].forEach(([o, c, a]) => { const s = document.createElementNS(NS, 'stop'); s.setAttribute('offset', o); s.setAttribute('stop-color', c); s.setAttribute('stop-opacity', a); fade.appendChild(s); });
    el('rect', { width: 1200, height: 630, fill: 'url(#fade)' });
  }
</script>
</body>
</html>
